[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subtitle-grounding"
version = "0.2.0"
description = "Video subtitle extraction, translation, layout and MediaKit rendering"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
  "byteplus-python-sdk-v2[ark]>=3.0.58,<4",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.35,<1"]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1", "fastapi>=0.115,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
